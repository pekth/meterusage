appId: dev.meterusage.app
productName: MeterUsage
afterPack: Scripts/electron/after-pack.cjs
asar: true
buildVersion: "46"
directories:
  output: release
files:
  - dist/main/**
  - dist/preload/**
  - dist/renderer/**
  - package.json
extraResources:
  - from: dist/api-helper/api-usage-helper.cjs
    to: api-usage-helper.cjs
mac:
  extraResources:
    - from: build/desktop-keychain
      to: desktop-keychain
  target:
    - target: zip
      arch: [arm64]
  artifactName: MeterUsage-${version}.zip
  icon: Resources/AppIcon.icns
  category: public.app-category.developer-tools
  minimumSystemVersion: "13.0"
  identity: "-"
  hardenedRuntime: true
  notarize: false
  extendInfo:
    LSUIElement: true
    NSAppTransportSecurity:
      NSAllowsArbitraryLoads: false
win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  icon: build/AppIcon.ico
nsis:
  artifactName: MeterUsage-${version}-${arch}-setup.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
portable:
  artifactName: MeterUsage-${version}-${arch}-portable.${ext}
