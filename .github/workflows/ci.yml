name: CI

# The ci job calls the shared workflow; see
# https://github.com/tilorahdotco/.github/blob/main/docs/USAGE.md

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Changes
    uses: tilorahdotco/.github/.github/workflows/changes.yml@f7a775a9e139a7a9d2bd52657b8f69009e9574df
    with:
      runner: ubuntu-latest

  # Public repository: pull request code runs on GitHub-hosted runners only.
  ci:
    name: CI
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    uses: tilorahdotco/.github/.github/workflows/node-ci.yml@f7a775a9e139a7a9d2bd52657b8f69009e9574df
    with:
      runner: ubuntu-latest
      timeout-minutes: 10
      node-version: '24'
      package-manager: pnpm
      pnpm-version: 12.9.1
      typecheck: pnpm typecheck
      test: pnpm test
      build: |
        pnpm build
        bash tests/scripts/make-app-tests.sh
  # Windows has no physical test machine; this runner is the test machine (ADR 0038).
  windows:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      # Keep LF fixtures byte-identical to the other platforms.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Install pnpm
        run: npm install --global pnpm@12.9.1 --ignore-scripts
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Test (Windows-safe subset)
        run: pnpm test:windows
      - name: Full test suite (informational)
        continue-on-error: true
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Package unsigned Windows build
        run: pnpm exec electron-builder --win --x64 --publish never
      - name: Smoke test packaged app
        shell: pwsh
        run: ./Scripts/electron/windows-smoke.ps1
      - name: Smoke test installer, update handoff and uninstall
        shell: pwsh
        run: ./Scripts/electron/windows-install-smoke.ps1
      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-smoke
          path: smoke-artifacts
          retention-days: 14
      - name: Upload Windows packages
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-packages
          path: |
            release/*.exe
            release/*.zip
          retention-days: 7

  gate:
    name: CI gate
    needs: [changes, ci, windows]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "needed job results: $RESULTS"
          case " $RESULTS " in *" failure "*|*" cancelled "*) exit 1 ;; esac
